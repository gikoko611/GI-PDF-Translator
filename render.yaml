services:
  - type: web
    name: gi-pdf-translator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MODELGO_API_KEY
        sync: false
      - key: MODELGO_MODEL
        value: claude-sonnet-5.5:free
      - key: MYANMAR_FONT_PATH
        value: fonts/NotoSansMyanmar-Regular.ttf
      - key: MAX_UPLOAD_MB
        value: "15"
